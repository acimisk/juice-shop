name: AppSec DevSecOps Pipeline

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  semgrep-scan:
    name: Run Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF çıktısını GitHub Security sekmesine yüklemek için şart

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SARIF Scan
        run: |
          semgrep scan --config=auto --sarif -o semgrep-results.sarif || true

      # Çıktıyı zip olarak indirmek için
      - name: Upload Scan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

      # Çıktıyı doğrudan GitHub'ın "Security -> Code scanning" sekmesine basar
      - name: Upload to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
